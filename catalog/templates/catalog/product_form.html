{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>{% if object %}Редактирование{% else %}Создание{% endif %} товара</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'catalog:home' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
