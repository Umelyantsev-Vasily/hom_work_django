{% extends 'blog/base.html' %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}
<h1>Подтверждение удаления</h1>

<p>Вы уверены, что хотите удалить статью "{{ object.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
